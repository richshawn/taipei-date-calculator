name: Update calendar data

on:
  schedule:
    # 台北時間每天 06:15
    # GitHub Actions cron 使用 UTC，所以是前一天 22:15 UTC
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: pip install requests beautifulsoup4

      - name: Refresh Taiwan holidays, TWSE closures and macro events
        run: python scripts/update_data.py

      - name: Commit data changes
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes"
            exit 0
          fi

          git config user.name "calendar-data-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/
          git commit -m "chore: refresh calendar data"
          git push
